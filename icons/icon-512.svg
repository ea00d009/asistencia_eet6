<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c81" />
      <stop offset="100%" stop-color="#092847" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Outer Technical Gear Ring -->
  <g transform="translate(256, 230)" fill="url(#gearGrad)" opacity="0.95">
    <!-- Gear teeth -->
    <path d="M-22,-145 L22,-145 L18,-115 L-18,-115 Z" />
    <path d="M-22,-145 L22,-145 L18,-115 L-18,-115 Z" transform="rotate(45)" />
    <path d="M-22,-145 L22,-145 L18,-115 L-18,-115 Z" transform="rotate(90)" />
    <path d="M-22,-145 L22,-145 L18,-115 L-18,-115 Z" transform="rotate(135)" />
    <path d="M-22,-145 L22,-145 L18,-115 L-18,-115 Z" transform="rotate(180)" />
    <path d="M-22,-145 L22,-145 L18,-115 L-18,-115 Z" transform="rotate(225)" />
    <path d="M-22,-145 L22,-145 L18,-115 L-18,-115 Z" transform="rotate(270)" />
    <path d="M-22,-145 L22,-145 L18,-115 L-18,-115 Z" transform="rotate(315)" />
    <!-- Gear Body -->
    <circle r="120" fill="url(#gearGrad)" />
    <circle r="88" fill="#0c355b" />
  </g>

  <!-- Checkmark Icon in Center -->
  <path d="M195 235 L235 275 L318 185" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Badge Text EET N° 6 -->
  <rect x="136" y="375" width="240" height="58" rx="29" fill="#ffffff" />
  <text x="256" y="415" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0f4c81" text-anchor="middle" letter-spacing="2">E.E.T. N° 6</text>
</svg>
